[package]
name = "witnos-cli"
version.workspace = true
edition.workspace = true

# The headless bin. Must never depend on the `tauri` crate (links no webview
# runtime: small, ms-start, headless/CI-safe).
[[bin]]
name = "witnos"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain HTTP to 127.0.0.1 only — no TLS, keeps the bin tiny.
ureq = { version = "2", default-features = false, features = ["json"] }
# Shared marker shape + resolution rules (the constraint is "no tauri crate";
# witnos-core pulls only serde/serde_json/uuid).
witnos-core = { path = "../witnos-core" }

[dev-dependencies]
witnos-server = { path = "../witnos-server" }
tokio = { version = "1", features = ["rt-multi-thread"] }
